name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS role, no stored keys

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      - run: sam build
      - run: >-
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
          --region ${{ vars.AWS_REGION || 'eu-central-1' }}
          --parameter-overrides
          CorsOrigins="${{ vars.CORS_ORIGINS }}"
          MailSecretName="portfolio/contact-mail"
          AlarmEmail="${{ vars.ALARM_EMAIL }}"
