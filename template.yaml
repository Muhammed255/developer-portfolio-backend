AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Developer portfolio contact-form API (Lambda + HTTP API + DynamoDB rate limiting)

Parameters:
  CorsOrigins:
    Type: String
    Description: Comma-separated frontend origins allowed by CORS
    Default: https://mohamed-abdelazim.netlify.app
  MailSecretName:
    Type: String
    Description: >-
      Secrets Manager secret holding a JSON object with keys
      MAIL_LOGIN_USER, MAIL_LOGIN_PASS, MAIL_TO and optionally MAIL_FROM,
      MAIL_HOST, MAIL_PORT. Read at runtime, so updates need no redeploy.
    Default: portfolio/contact-mail
  AlarmEmail:
    Type: String
    Description: Email notified when the function errors (leave empty to skip)
    Default: ""

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # CORS is handled by the Express app (single source of truth), so
      # preflight OPTIONS requests are forwarded to the function.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  ContactFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-contact
      RetentionInDays: 14

  ContactFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-contact
      CodeUri: .
      Handler: src/lambda.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      LoggingConfig:
        LogGroup: !Ref ContactFunctionLogs
      Environment:
        Variables:
          NODE_ENV: production
          CORS_ORIGINS: !Ref CorsOrigins
          RATE_LIMIT_TABLE: !Ref RateLimitTable
          MAIL_SECRET_ID: !Ref MailSecretName
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt RateLimitTable.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MailSecretName}-*
      Events:
        Default:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: Contact function errors or 5xx responses
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ContactFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: Contact API returned 5xx (includes failed email delivery)
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ApiUrl:
    Description: Base URL for the frontend's environment.apiUrl
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
